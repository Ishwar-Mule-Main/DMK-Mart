# ═══════════════════════════════════════════════════════════════
# DMK Mart ERP — Docker Compose
# Start:  docker compose up -d --build
# Logs:   docker compose logs -f
# Stop:   docker compose down        (data survives in the volume)
# ═══════════════════════════════════════════════════════════════
services:
  erp:
    build: .
    container_name: dmk-mart-erp
    ports:
      - "3000:3000"
    volumes:
      - erp-data:/data          # persists the SQLite database file
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  erp-data:
